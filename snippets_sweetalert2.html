<div class="section" id="sweetalert2" data-tags="sweetalert2">
  <div class="snippet-block" data-tags="sweetalert2 site oficial">

      gap: 18px;

      border: 1px solid #3084f2;

      padding: 22px 28px;
      margin-bottom: 18px;
