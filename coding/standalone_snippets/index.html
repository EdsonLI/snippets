<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview dinâmico com Glightbox</title>

  <!-- Bootstrap + jQuery + Glightbox -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

  <style>
    body {
      background-color: #111;
      color: #fff;
      padding: 2rem;
      font-family: sans-serif;
    }
    .btn-outline-info {
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <h2 class="mb-4">Teste de Preview com Glightbox + GitHub RAW</h2>

  <!-- Botão de preview -->
  <a href="#preview-isotope" id="preview-link" class="btn btn-outline-info" onclick="loadIsotope()">
    <iconify-icon icon="mdi:eye-outline"></iconify-icon> Pré-visualizar Isotope
  </a>

  <!-- Container oculto que será preenchido dinamicamente -->
  <div id="preview-isotope" style="display:none;" class="glightbox-content">
    <div class="p-4 text-center">Carregando conteúdo do GitHub...</div>
  </div>

  <!-- Script principal -->
  <script>
  let qsRegex; // <-- adiciona isso no início

function loadIsotope() {
  if (loadedIsotope) return;

  fetch('https://raw.githubusercontent.com/EdsonLI/snippets/main/coding/standalone_snippets/isotope_sample_1.html')
    .then(res => res.text())
    .then(html => {
      const container = document.querySelector('#preview-isotope');
      container.innerHTML = html;

      const $grid = $('.grid', container).isotope({
        itemSelector: '.grid-item',
        layoutMode: 'fitRows',
        getSortData: {
          name: '[data-name]',
          number: '[data-number] parseInt'
        },
        filter: function () {
          return qsRegex ? $(this).text().match(qsRegex) : true;
        }
      });

      $('#filters button', container).on('click', function () {
        $('#filters button', container).removeClass('active');
        $(this).addClass('active');
        const filterValue = $(this).attr('data-filter');
        $grid.isotope({ filter: function () {
          const matchesSearch = qsRegex ? $(this).text().match(qsRegex) : true;
          const matchesFilter = filterValue === '*' || $(this).is(filterValue);
          return matchesSearch && matchesFilter;
        }});
      });

      $('#sorts button', container).on('click', function () {
        $('#sorts button', container).removeClass('active');
        $(this).addClass('active');
        const sortValue = $(this).attr('data-sort-by');
        $grid.isotope({ sortBy: sortValue });
      });

      $('#search', container).on('keyup', debounce(function () {
        qsRegex = new RegExp($('#search', container).val(), 'gi');
        $grid.isotope();
      }, 200));

      loadedIsotope = true;
    })
    .catch(err => {
      document.querySelector('#preview-isotope').innerHTML = '<p class="text-danger">Erro ao carregar snippet.</p>';
      console.error(err);
    });
}

// debounce já pode estar fora
function debounce(fn, delay) {
  let timeout;
  return function () {
    clearTimeout(timeout);
    timeout = setTimeout(fn.bind(this), delay);
  };
}

  </script>

  <!-- Iconify (opcional) -->
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>

</body>
</html>
