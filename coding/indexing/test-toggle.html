<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Toggle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Sistema Global de Toggle de Tema -->
    <link href="assets/theme-toggle.css" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
    <script src="assets/theme-toggle.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1>Teste do Toggle de Tema</h1>
        
        <!-- Toggle de Tema -->
        <button id="themeToggle" class="btn btn-sm theme-toggle-btn" type="button" title="Alternar tema" aria-label="Alternar tema">
            <iconify-icon id="theme-icon" icon="line-md:light-dark" style="vertical-align: middle;"></iconify-icon>
        </button>
        
        <div class="card mt-4 p-3">
            <h5>Teste de Card</h5>
            <p>Este é um teste para verificar se o toggle está funcionando.</p>
            <pre><code>console.log('Teste de código');</code></pre>
        </div>
        
        <button onclick="window.snippetTheme.debug()" class="btn btn-primary mt-3">Debug Toggle</button>
    </div>
</body>
</html>
