<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Sistema Global de Toggle de Tema -->
  <link href="assets/theme-toggle.css" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
  
  <title>Debug Toggle - Snippets jQuery</title>
</head>
<body class="theme-dark">
  <!-- Toggle de Tema -->
  <button id="themeToggle" class="btn btn-sm theme-toggle-btn" type="button" title="Alternar tema" aria-label="Alternar tema">
    <iconify-icon id="theme-icon" icon="line-md:light-dark" style="vertical-align: middle;"></iconify-icon>
  </button>

  <section class="py-5">
    <div class="container">
      <h1>Debug do Toggle - Página jQuery</h1>
      
      <div class="row">
        <div class="col-md-6">
          <div class="card p-3 mb-3">
            <h5 class="card-title">Teste de Card</h5>
            <p>Este card deve mudar de cor quando o toggle for acionado.</p>
            <pre><code>$(document).ready(function() {
  console.log('jQuery carregado');
});</code></pre>
          </div>
        </div>
        
        <div class="col-md-6">
          <div class="card p-3 mb-3">
            <h5>Debug Info</h5>
            <p id="theme-info">Carregando...</p>
            <button onclick="debugToggle()" class="btn btn-primary btn-sm">Debug Toggle</button>
            <button onclick="forceToggle()" class="btn btn-warning btn-sm">Forçar Toggle</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    // Debug functions
    function debugToggle() {
      console.log('=== DEBUG TOGGLE ===');
      console.log('Classes do body:', document.body.className);
      console.log('Tema salvo:', localStorage.getItem('snippetTheme'));
      console.log('Botão existe:', !!document.getElementById('themeToggle'));
      console.log('SnippetTheme global:', typeof window.snippetTheme);
      
      document.getElementById('theme-info').innerHTML = `
        <strong>Classes do body:</strong> ${document.body.className}<br>
        <strong>Tema salvo:</strong> ${localStorage.getItem('snippetTheme')}<br>
        <strong>Botão existe:</strong> ${!!document.getElementById('themeToggle')}<br>
        <strong>Window.snippetTheme:</strong> ${typeof window.snippetTheme}
      `;
    }
    
    function forceToggle() {
      const isDark = document.body.classList.contains('theme-dark');
      const newTheme = isDark ? 'theme-light' : 'theme-dark';
      
      document.body.classList.remove('theme-dark', 'theme-light');
      document.body.classList.add(newTheme);
      localStorage.setItem('snippetTheme', newTheme);
      
      console.log('Tema forçado para:', newTheme);
      debugToggle();
    }
    
    // Auto-debug na carga
    window.addEventListener('load', function() {
      debugToggle();
    });
  </script>
  
  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/theme-toggle.js"></script>
</body>
</html>
