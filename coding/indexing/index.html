<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snippets Indexing</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/tech-icons-uniform.css">
    <link rel="stylesheet" href="../../assets/css/tech-badges-new.css">
    <link rel="stylesheet" href="../../assets/css/snippet-actions.css">
    <link rel="stylesheet" href="../../assets/css/snippet-actions-responsive.css">
    <link rel="stylesheet" href="../../assets/css/iconify-alignment-fix.css">
    <link rel="stylesheet" href="../../assets/css/search-functionality.css">
    <link rel="stylesheet" href="../../assets/css/git-snippet-scroll.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/static-snippets-manager.js" defer></script>
    <script src="../../assets/js/tech-badges-new.js" defer></script>
    <script src="../../assets/js/reload-tech-icons.js" defer></script>
    <script src="../../assets/js/sql-icon-fix.js" defer></script>
    <script src="../../assets/js/git-icon-fix.js" defer></script>
    <script src="../../assets/js/php-icon-fix.js" defer></script>
    <script src="../../assets/js/sweetalert2-icon-fix.js" defer></script>
    <script src="../../assets/js/snippet-external-links.js" defer></script>
    <script src="../../assets/js/button-position-fix.js" defer></script>
    <script src="../../assets/js/snippet-responsive-loader.js" defer></script>
    <script src="../../assets/js/snippets-search.js" defer></script>
</head>
<body>
    <h1>Snippets Indexing</h1>
    <div class="search-wrapper">
        <input type="text" id="search" placeholder="Buscar snippets (ex: store, find, card, etc)">
        <button id="refresh-list" title="Limpar busca e filtros">Limpar</button>
    </div>
    <div class="tabs">
        <button class="tab" data-target="git-content">Git</button>
        <button class="tab" data-target="isotope-content">Isotope</button>
        <button class="tab" data-target="vscode-content">VSCode</button>
        <button class="tab" data-target="sweetalert2-content">SweetAlert2</button>
        <button class="tab" data-target="fontawesome-content">FontAwesome</button>
        <button class="tab" data-target="jquery-content">jQuery</button>
        <button class="tab" data-target="css-content">CSS</button>
        <button class="tab" data-target="bootstrap-content">Bootstrap</button>
        <button class="tab" data-target="html-content">HTML</button>
        <button class="tab" data-target="php-content">PHP</button>
        <button class="tab" data-target="sql-content">SQL</button>
        <button class="tab" data-target="codepen-content">CodePen</button>
    </div>
    <div id="git-content" class="tab-content">Conteúdo Git</div>
    <div id="isotope-content" class="tab-content">Conteúdo Isotope</div>
    <div id="vscode-content" class="tab-content">Conteúdo VSCode</div>
    <div id="sweetalert2-content" class="tab-content">Conteúdo SweetAlert2</div>
    <div id="fontawesome-content" class="tab-content">Conteúdo FontAwesome</div>
    <div id="jquery-content" class="tab-content">Conteúdo jQuery</div>
    <div id="css-content" class="tab-content">Conteúdo CSS</div>
    <div id="bootstrap-content" class="tab-content">Conteúdo Bootstrap</div>
    <div id="html-content" class="tab-content">Conteúdo HTML</div>
    <div id="php-content" class="tab-content">Conteúdo PHP</div>
    <div id="sql-content" class="tab-content">Conteúdo SQL</div>
    <div id="codepen-content" class="tab-content">Conteúdo CodePen</div>
</body>
</html>
