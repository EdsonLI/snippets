<!-- Definição de estilo inline para garantir que os blocos de código tenham fundo escuro -->
<style>
  /* Regras altamente específicas para sobrescrever qualquer outro estilo */
  .code-block-wrapper,
  .code-block-wrapper pre,
  .code-block-wrapper pre code,
  .code-block-wrapper pre code.hljs,
  div.code-block-wrapper > pre > code,
  div[class*="code-block-wrapper"] > pre > code,
  pre, 
  pre code,
  pre code.hljs,
  .hljs,
  code.hljs,
  .language-json,
  .hljs-punctuation,
  [data-highlighted="yes"] {
    background-color: #161b22 !important;
    color: #e6edf3 !important;
  }
  
  /* Estilo específico para o wrapper ser transparente */
  div.code-block-wrapper {
    background-color: transparent !important;
  }
  
  /* Garantir que nenhum elemento dentro do bloco de código tenha fundo claro */
  .code-block-wrapper *:not(button):not(.btn):not(.btn-copy) {
    background-color: #161b22 !important;
  }
</style>
