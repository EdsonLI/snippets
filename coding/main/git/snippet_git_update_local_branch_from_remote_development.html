<!-- Atualizar sua branch com as mudanças mais recentes da development (já com os merges de PRs), sem perder suas próprias edições:

Opção 1: Merge da development na sua branch (mais simples e segura)
Esse é o jeito mais comum em times colaborativos.

Passo a passo:

# Estar na sua branch
git checkout minha-branch

# Atualiza a development local
git fetch origin
git checkout development
git pull origin development

# Volta para sua branch
git checkout minha-branch

# Faz o merge da development atualizada nela
git merge development


Opção 2: Rebase da sua branch sobre a development (histórico linear, mas mais avançado)
Esse método reorganiza os commits como se sua branch tivesse sido criada agora, em cima do development.

Passo a passo:
# Atualiza a development
git fetch origin
git checkout development
git pull origin development

# Volta para sua branch
git checkout minha-branch

# Faz o rebase
git rebase development



<pre></pre>
  </pre>✅ PR atualizada e pronta para nova revisão!</code>
</pre> -->
