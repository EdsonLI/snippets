<!-- Script para garantir que o posicionamento do link externo esteja correto -->
<script>
  // Aplicar posicionamento após carregamento completo da página
  document.addEventListener('DOMContentLoaded', function() {
    // Obter o link externo
    const externalLink = document.querySelector('a[data-snippet-external-link]');
    
    // Função para forçar os estilos
    function forceStyles() {
      if (externalLink) {
        // Limpar qualquer estilo existente
        externalLink.setAttribute('style', '');
        
        // Aplicar os estilos críticos como atributos de estilo inline (nível mais alto de especificidade)
        externalLink.style.position = 'absolute';
        externalLink.style.top = '3px';
        externalLink.style.right = '5px';
        externalLink.style.zIndex = '9999';
        externalLink.style.display = 'flex';
        externalLink.style.alignItems = 'center';
        externalLink.style.justifyContent = 'center';
        externalLink.style.width = '22px';
        externalLink.style.height = '22px';
        externalLink.style.visibility = 'visible';
        externalLink.style.opacity = '1';
        
        // Forçar o ícone a ficar centralizado
        const icon = externalLink.querySelector('iconify-icon');
        if (icon) {
          icon.setAttribute('style', '');
          icon.style.display = 'flex';
          icon.style.alignItems = 'center';
          icon.style.justifyContent = 'center';
          icon.style.margin = '0';
          icon.style.padding = '0';
        }
      }
    }
    
    // Aplicar imediatamente
    forceStyles();
    
    // Aplicar novamente após um pequeno delay (caso outros scripts interfiram)
    setTimeout(forceStyles, 100);
    
    // Aplicar novamente após carregamento completo (incluindo imagens)
    window.addEventListener('load', forceStyles);
  });
</script>
