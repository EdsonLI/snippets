<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snippets com Isotope</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Iconify (para ícones nos badges, se quiser usar) -->
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>

  <!-- jQuery + Isotope -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>

  <style>
    body {
      background-color: #121212;
      color: #fff;
      padding: 2rem;
    }
    .card {
      background-color: #1e1e1e;
      border: 1px solid #333;
    }
    .filter-button-group .btn.active {
      background-color: #0dcaf0;
      color: #000;
    }
    pre {
      background-color: #2d2d2d;
      color: #0f0;
      padding: 1rem;
      border-radius: 5px;
      overflow-x: auto;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h2 class="mb-4">Snippets com Isotope (standalone)</h2>

  <!-- Botões de filtro -->
  <div class="mb-4 filter-button-group">
    <button class="btn btn-sm btn-outline-light active" data-filter="*">Todos</button>
    <button class="btn btn-sm btn-outline-info" data-filter=".filter-php">PHP</button>
    <button class="btn btn-sm btn-outline-warning" data-filter=".filter-js">JavaScript</button>
  </div>

  <!-- Container dos cards -->
  <div class="row grid" id="snippet-container"></div>

  <!-- Script -->
  <script>
    const snippets = [
      {
        id: "s1",
        title: "Exemplo PHP",
        language: "php",
        code: `<?php echo "Olá mundo"; ?>`
      },
      {
        id: "s2",
        title: "Console Log JS",
        language: "js",
        code: `console.log("Hello jQuery");`
      },
      {
        id: "s3",
        title: "Array e loop em PHP",
        language: "php",
        code: `<?php 
$itens = ["A", "B", "C"];
foreach ($itens as $item) {
  echo $item . "<br>";
}
?>`
      }
    ];

    $(document).ready(function () {
      const $container = $('#snippet-container');

      snippets.forEach(function (snippet) {
        const filterClass = "filter-" + snippet.language;
        const card = $(\`
          <div class="col-md-6 col-lg-4 mb-4 portfolio-item \${filterClass}">
            <div class="card h-100">
              <div class="card-body">
                <h5 class="card-title text-info">\${snippet.title}</h5>
                <span class="badge bg-secondary mb-2">\${snippet.language.toUpperCase()}</span>
                <pre><code>\${snippet.code}</code></pre>
              </div>
            </div>
          </div>
        \`);
        $container.append(card);
      });

      const iso = new Isotope('.grid', {
        itemSelector: '.portfolio-item',
        layoutMode: 'fitRows'
      });

      $('.filter-button-group button').on('click', function () {
        $('.filter-button-group button').removeClass('active');
        $(this).addClass('active');
        const filtro = $(this).attr('data-filter');
        iso.arrange({ filter: filtro });
      });
    });
  </script>

</body>
</html>
