<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Isotope Avançado - Exemplo HTML</title>

  <!-- Bootstrap + jQuery + Isotope CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>

  <style>
    body {
      background-color: #111;
      color: #fff;
      padding: 2rem;
      font-family: sans-serif;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .grid-item {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1rem;
      width: 200px;
    }

    .grid-item h5 {
      color: #0dcafe;
      margin-bottom: 0.5rem;
    }

    .controls {
      margin-bottom: 2rem;
    }

    .btn-group .btn.active {
      background-color: #0dcafe;
      color: #000;
    }

    .form-control {
      max-width: 300px;
    }

    @media (max-width: 768px) {
      .controls {
        flex-direction: column;
        gap: 1rem;
      }

      .grid-item {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h2>Exemplo Avançado - Isotope com jQuery</h2>

  <!-- Controles -->
  <div class="controls d-flex flex-wrap gap-3 align-items-center mb-4">
    <div class="btn-group" id="filters">
      <button class="btn btn-outline-light active" data-filter="*">Todos</button>
      <button class="btn btn-outline-light" data-filter=".categoria-1">Categoria 1</button>
      <button class="btn btn-outline-light" data-filter=".categoria-2">Categoria 2</button>
      <button class="btn btn-outline-light" data-filter=".categoria-3">Categoria 3</button>
    </div>

    <div class="btn-group" id="sorts">
      <button class="btn btn-outline-info" data-sort-by="name">Título</button>
      <button class="btn btn-outline-info" data-sort-by="number">Número</button>
    </div>

    <input type="text" id="search" class="form-control" placeholder="Buscar..." />
    <button id="reset" class="btn btn-warning">Resetar</button>
    <button id="add-item" class="btn btn-success">Adicionar Item</button>
  </div>

  <!-- Container com itens -->
  <div class="grid">
    <div class="grid-item categoria-1" data-name="Alpha" data-number="3">
      <h5>Alpha</h5>
      <p>Número: 3</p>
    </div>
    <div class="grid-item categoria-2" data-name="Beta" data-number="1">
      <h5>Beta</h5>
      <p>Número: 1</p>
    </div>
    <div class="grid-item categoria-1" data-name="Gamma" data-number="2">
      <h5>Gamma</h5>
      <p>Número: 2</p>
    </div>
    <div class="grid-item categoria-3" data-name="Delta" data-number="5">
      <h5>Delta</h5>
      <p>Número: 5</p>
    </div>
    <div class="grid-item categoria-2" data-name="Epsilon" data-number="4">
      <h5>Epsilon</h5>
      <p>Número: 4</p>
    </div>
  </div>

  <!-- Script -->
  <script>
    let qsRegex;

    const $grid = $('.grid').isotope({
      itemSelector: '.grid-item',
      layoutMode: 'fitRows',
      getSortData: {
        name: '[data-name]',
        number: '[data-number] parseInt'
      },
      filter: function () {
        return qsRegex ? $(this).text().match(qsRegex) : true;
      }
    });

    // Filtros
    $('#filters').on('click', 'button', function () {
      $('#filters button').removeClass('active');
      $(this).addClass('active');
      const filterValue = $(this).attr('data-filter');
      $grid.isotope({ filter: function () {
        const matchesSearch = qsRegex ? $(this).text().match(qsRegex) : true;
        const matchesFilter = filterValue === '*' || $(this).is(filterValue);
        return matchesSearch && matchesFilter;
      }});
    });

    // Ordenação
    $('#sorts').on('click', 'button', function () {
      $('#sorts button').removeClass('active');
      $(this).addClass('active');
      const sortValue = $(this).attr('data-sort-by');
      $grid.isotope({ sortBy: sortValue });
    });

    // Busca
    $('#search').on('keyup', debounce(function () {
      qsRegex = new RegExp($('#search').val(), 'gi');
      $grid.isotope();
    }, 200));

    // Resetar filtros e busca
    $('#reset').on('click', function () {
      $('#filters button').removeClass('active').first().addClass('active');
      $('#search').val('');
      qsRegex = null;
      $grid.isotope({ filter: '*' });
    });

    // Adicionar novo item
    $('#add-item').on('click', function () {
      const newItem = $(`
        <div class="grid-item categoria-3" data-name="Zeta" data-number="6">
          <h5>Zeta</h5>
          <p>Número: 6</p>
        </div>
      `);
      $grid.append(newItem).isotope('appended', newItem);
    });

    // Função debounce
    function debounce(fn, delay) {
      let timeout;
      return function () {
        clearTimeout(timeout);
        timeout = setTimeout(fn.bind(this), delay);
      };
    }
  </script>

</body>
</html>
