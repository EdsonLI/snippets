<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visualizador de JSON</title>

  <!-- Bootstrap + jQuery -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: monospace;
      padding: 2rem;
    }

    .json-container {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1rem;
      white-space: pre-wrap;
      word-break: break-word;
      color: #0dcafe;
    }
  </style>
</head>
<body>

  <h2 class="text-info mb-4">Visualizador de JSON</h2>

  <div class="json-container" id="jsonOutput"></div>

  <script>
    $(function () {
      const dados = {
        nome: "Edson",
        idade: 28,
        ativo: true,
        tecnologias: ["PHP", "JS", "SQL"],
        perfil: {
          nivel: "Avançado",
          interesse: "Fullstack"
        }
      };

      const jsonFormatado = JSON.stringify(dados, null, 2);
      $('#jsonOutput').text(jsonFormatado);
    });
  </script>

</body>
</html>
