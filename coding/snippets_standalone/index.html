<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview Isotope com Modal e iFrame</title>

  <!-- Bootstrap CSS (5.3) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Iconify para ícones -->
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>

  <style>
    body {
      background-color: #111;
      color: #fff;
      padding: 2rem;
      font-family: sans-serif;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div class="container text-center">
    <h2 class="mb-4">Preview Standalone Isotope com Modal + iFrame</h2>

    <!-- Botão para abrir modal -->
    <button class="btn btn-outline-info" data-bs-toggle="modal" data-bs-target="#previewModal">
      <iconify-icon icon="mdi:eye-outline" style="font-size: 20px;"></iconify-icon>
      Ver Preview
    </button>

    <!-- Modal Bootstrap -->
    <div class="modal fade" id="previewModal" tabindex="-1" aria-labelledby="previewModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered modal-fullscreen-md-down">
        <div class="modal-content bg-dark text-white border-light">
          <div class="modal-header border-secondary">
            <h5 class="modal-title" id="previewModalLabel">Pré-visualização Isotope (funcional)</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body p-0" style="height: 85vh;">
            <iframe 
              src="https://edsonli.github.io/snippets/coding/snippets_standalone/isotope_basic_sample.html" 
              width="100%" height="100%" frameborder="0" style="border:none;">
            </iframe>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Bootstrap Bundle JS (com Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
