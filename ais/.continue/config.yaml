name: Dev Assistant (GPT-4 Turbo)
version: 1.0.0
schema: v1

models:
  - name: GPT-4 Turbo (Programação)
    provider: openai
    model: gpt-4
    apiKey: sk-...SUA_CHAVE_AQUI...
    chatOptions:
      temperature: 0.1
      maxTokens: 8192
      topP: 0.95
      stopSequences: []

context:
  - provider: code         # Código atual
  - provider: docs         # Documentação dos arquivos
  - provider: diff         # Alterações no código
  - provider: terminal     # Acesso ao terminal (opcional)
  - provider: problems     # Problemas e erros
  - provider: folder       # Estrutura de pastas
  - provider: codebase     # Todo o contexto da base de código