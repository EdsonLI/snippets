<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Ícone CSS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .test-section {
      background-color: #222;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    h1, h2 {
      color: #333;
    }
    .tech-badges-container {
      display: flex;
      gap: 15px;
      margin: 20px 0;
    }
    .bg-white {
      background-color: #fff;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
  <link rel="stylesheet" href="../assets/css/tech-icons-common.css">
  <link rel="stylesheet" href="../assets/css/jquery-icon-simple.css">
  <link rel="stylesheet" href="../assets/css/bootstrap-icon-custom.css">
  <link rel="stylesheet" href="../assets/css/w3schools-icon-custom.css">
  <link rel="stylesheet" href="../assets/css/css-icon-custom.css">
</head>
<body>

<div class="container">
  <h1>Teste do Ícone CSS</h1>
  
  <div class="test-section">
    <h2 style="color: #fff; margin-top: 0;">Ícones em fundo escuro</h2>
    <div class="tech-badges-container">
      <div class="tech-badge">
        <span class="tech" data-tech="css">CSS</span>
      </div>
      <div class="tech-badge">
        <span class="tech" data-tech="jquery">jQuery</span>
      </div>
      <div class="tech-badge">
        <span class="tech" data-tech="bootstrap">Bootstrap</span>
      </div>
      <div class="tech-badge">

      </div>
    </div>
  </div>

  <div class="test-section bg-white">
    <h2 style="color: #333; margin-top: 0;">Ícones em fundo claro</h2>
    <div class="tech-badges-container">
      <div class="tech-badge">
        <span class="tech" data-tech="css">CSS</span>
      </div>
      <div class="tech-badge">
        <span class="tech" data-tech="jquery">jQuery</span>
      </div>
      <div class="tech-badge">
        <span class="tech" data-tech="bootstrap">Bootstrap</span>
      </div>
      <div class="tech-badge">
        <span class="tech" data-tech="w3schools">W3Schools</span>
      </div>
    </div>
  </div>

  <div class="test-section">
    <h2 style="color: #fff; margin-top: 0;">Diferentes tamanhos</h2>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div class="tech-badge" style="font-size: 14px;">
        <span class="tech" data-tech="css">CSS</span>
      </div>
      <div class="tech-badge" style="font-size: 16px;">
        <span class="tech" data-tech="css">CSS</span>
      </div>
      <div class="tech-badge" style="font-size: 18px;">
        <span class="tech" data-tech="css">CSS</span>
      </div>
      <div class="tech-badge" style="font-size: 20px;">
        <span class="tech" data-tech="css">CSS</span>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/tech-badges-new.js"></script>

  document.addEventListener("DOMContentLoaded", function() {

</html>
