<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Ícone W3Schools</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
  </style>
  <link rel="stylesheet" href="../assets/css/tech-icons-common.css">
  <link rel="stylesheet" href="../assets/css/jquery-icon-simple.css">
  <link rel="stylesheet" href="../assets/css/bootstrap-icon-custom.css">
  <link rel="stylesheet" href="../assets/css/w3schools-icon-custom.css">
</head>
<body>

<div class="container">
  <h1>Teste do Ícone W3Schools</h1>
  
  <div style="margin: 30px 0;">
    <h2>W3Schools Badge</h2>
    <div class="tech-badge">
      <span class="tech" data-tech="w3schools">W3Schools</span>
    </div>
  </div>

  <div style="margin: 30px 0;">
    <h2>Comparação com outros ícones</h2>
    <div style="display: flex; gap: 20px;">
      <div class="tech-badge">
        <span class="tech" data-tech="jquery">jQuery</span>
      </div>
      <div class="tech-badge">
        <span class="tech" data-tech="bootstrap">Bootstrap</span>
      </div>
      <div class="tech-badge">
        <span class="tech" data-tech="w3schools">W3Schools</span>
      </div>
    </div>
  </div>

  <div style="margin: 30px 0;">
    <h2>Diferentes tamanhos</h2>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div class="tech-badge" style="font-size: 14px;">
        <span class="tech" data-tech="w3schools">W3Schools</span>
      </div>
      <div class="tech-badge" style="font-size: 16px;">
        <span class="tech" data-tech="w3schools">W3Schools</span>
      </div>
      <div class="tech-badge" style="font-size: 18px;">
        <span class="tech" data-tech="w3schools">W3Schools</span>
      </div>
      <div class="tech-badge" style="font-size: 20px;">
        <span class="tech" data-tech="w3schools">W3Schools</span>
      </div>
    </div>
  </div>

  <div style="margin: 30px 0;">
    <h2>Background escuro</h2>
    <div style="background-color: #333; padding: 20px; border-radius: 5px;">
      <div class="tech-badge">
        <span class="tech" data-tech="w3schools">W3Schools</span>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/tech-badges-new.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Transformar todos os badges de tecnologia
    transformTechBadges();
  });
</script>

</body>
</html>
