<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Ícone SQL</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .test-section {
      background-color: #222;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    h1, h2 {
      color: #333;
    }
    .tech-badges-container {
      display: flex;
      gap: 15px;
      margin: 20px 0;
    }
    .bg-white {
      background-color: #fff;
      padding: 15px;
      border-radius: 8px;
    }
    .mock-snippet {
      border: 1px solid #555;
      border-radius: 5px;
      padding: 10px;
      margin-bottom: 15px;
    }
    .mock-title {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }
  </style>
  <link rel="stylesheet" href="../assets/css/tech-icons-common.css">
  <link rel="stylesheet" href="../assets/css/sql-icon-custom.css">
  <link rel="stylesheet" href="../assets/css/jquery-icon-simple.css">
  <link rel="stylesheet" href="../assets/css/bootstrap-icon-custom.css">
  <link rel="stylesheet" href="../assets/css/w3schools-icon-custom.css">
  <link rel="stylesheet" href="../assets/css/css-icon-custom.css">
</head>
<body>

<div class="container">
  <h1>Teste do Ícone SQL</h1>
  
  <div class="test-section">
    <h2 style="color: #fff; margin-top: 0;">Badges de Tecnologia</h2>
    <div class="tech-badges-container">
      <div class="tech-badge">
        <span class="tech" data-tech="sql">SQL</span>
      </div>
      <div class="tech-badge">
        <span class="tech" data-tech="jquery">jQuery</span>
      </div>
      <div class="tech-badge">
        <span class="tech" data-tech="bootstrap">Bootstrap</span>
      </div>
      <div class="tech-badge">
        <span class="tech" data-tech="css">CSS</span>
      </div>
    </div>
  </div>

  <div class="test-section">
    <h2 style="color: #fff; margin-top: 0;">Simulação de Snippets</h2>
    
    <!-- Simulação do snippet SQL -->
    <div class="mock-snippet">
      <div class="mock-title">
        <span class="id-tech-sql">SQL</span>
      </div>
      <div>Conteúdo do snippet SQL</div>
    </div>
    
    <!-- Simulação do snippet jQuery -->
    <div class="mock-snippet">
      <div class="mock-title">
        <span class="id-tech-jquery">jQuery</span>
      </div>
      <div>Conteúdo do snippet jQuery</div>
    </div>
    
    <!-- Simulação do snippet CSS -->
    <div class="mock-snippet">
      <div class="mock-title">
        <span class="id-tech-css">CSS</span>
      </div>
      <div>Conteúdo do snippet CSS</div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="../assets/js/tech-badges-new.js"></script>
<script src="../assets/js/sql-icon-fix.js"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Transformar todos os badges de tecnologia
    transformTechBadges();
  });
</script>

</body>
</html>
