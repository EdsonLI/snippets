<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste do Ícone MadBuilder em Snippet</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- CSS do site -->
  <link href="../assets/css/main.css" rel="stylesheet">
  <link href="../assets/css/filter-icons.css" rel="stylesheet">
  <link href="../assets/css/tech-icons-uniform.css" rel="stylesheet">
  <link href="../assets/css/madbuilder-svg-fix.css" rel="stylesheet">
  
  <style>
    body { background-color: #212529; padding: 2rem; color: #fff; }
    .demo-section { margin-bottom: 2rem; padding: 1rem; border: 1px solid #444; border-radius: 5px; }
    .mb-card-bg { background-color: #343a40; }
    .border-secondary-custom { border-color: #495057 !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4">Teste do Ícone MadBuilder em Snippet</h1>
    
    <div class="demo-section">
      <h3>Snippet MadBuilder</h3>
      <div class="col-lg-6 mx-auto">
        <div class="portfolio-item isotope-item filter-madbuilder">
          <div class="portfolio-content h-100 p-2 mb-card-bg text-light rounded position-relative border border-secondary-custom">
            <h6 class="text-center position-relative">
              <span class="id-tech-madbuilder tech-badge tech-badge-madbuilder">
                <img src="../assets/img/madbuilder.svg" alt="MadBuilder" class="madbuilder-icon" width="16" height="16">
                MadBuilder
              </span>
              <div class="snippet-actions-float d-flex align-items-center gap-1" style="position: absolute; top: 3px; right: 5px; margin: 0px; padding: 0px; z-index: 100; transform: none;">
                <a href="https://madbuilder.com.br" target="_blank" class="btn btn-xs btn-outline-info btn-custom d-inline-flex" data-snippet-external-link="" title="Link para documentação externa">
                  <iconify-icon icon="mdi:open-in-new" width="16" height="16"></iconify-icon>
                </a>
              </div>
            </h6>
            <div class="p-2">
              Conteúdo de exemplo de um snippet do MadBuilder
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="demo-section">
      <h3>Filtros</h3>
      <ul class="portfolio-filters d-flex list-unstyled gap-4">
        <li data-filter=".filter-madbuilder" class="px-4">MadBuilder</li>
        <li data-filter=".filter-git" class="px-4">Git</li>
      </ul>
    </div>
  </div>
  
  <!-- Iconify para ícones -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</body>
</html>
