<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Ícones com Fundo Branco</title>
  
  <!-- Biblioteca Iconify -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  
  <!-- Estilos do Projeto -->
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/tech-badges-new.css">
  <link rel="stylesheet" href="../assets/css/tech-icons-common.css">
  <link rel="stylesheet" href="../assets/css/jquery-icon-simple.css">
  <link rel="stylesheet" href="../assets/css/bootstrap-icon-custom.css">
  <link rel="stylesheet" href="../assets/css/w3schools-icon-custom.css">
  <link rel="stylesheet" href="../assets/css/css-icon-custom.css">
  <link rel="stylesheet" href="../assets/css/isotope-icon-custom.css">
  
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
    }
    
    .test-section {
      margin-bottom: 30px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    
    h2 {
      margin-top: 0;
    }
    
    .example-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
      align-items: center;
    }
    
    .badge-example {
      padding: 10px;
      border: 1px dashed #ccc;
      border-radius: 4px;
    }
    
    pre {
      background-color: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }
    
    .result-section {
      background-color: #f8f9fa;
      padding: 15px;
      margin-top: 20px;
      border-radius: 4px;
    }
    
    .dark-bg {
      background-color: #333;
      color: white;
      padding: 20px;
      border-radius: 5px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Teste de Ícones com Fundo Branco</h1>
  
  <div class="test-section">
    <h2>Todas as Tecnologias</h2>
    
    <div class="example-row">
      <div class="badge-example">
        <span class="id-tech-html">HTML</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-css">CSS</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-javascript">JavaScript</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-php">PHP</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-bootstrap">Bootstrap</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-jquery">jQuery</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-git">Git</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-isotope">Isotope</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-sql">SQL</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-vscode">VS Code</span>
      </div>
    </div>
  </div>
  
  <div class="dark-bg">
    <h2>Em Fundo Escuro</h2>
    <div class="example-row">
      <div class="badge-example">
        <span class="id-tech-html">HTML</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-css">CSS</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-jquery">jQuery</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-isotope">Isotope</span>
      </div>
    </div>
  </div>
  
  <div class="test-section">
    <h2>Teste de Carregamento Dinâmico</h2>
    <button id="addDynamicBadges">Adicionar Badges Dinamicamente</button>
    <div id="dynamicBadgeContainer" class="result-section">
      <!-- Badges dinâmicos serão adicionados aqui -->
    </div>
  </div>
  
  <!-- Carregar Scripts do Projeto -->
  <script src="../assets/js/tech-badges-new.js"></script>
  
  <script>
    // Script para teste de carregamento dinâmico
    document.getElementById('addDynamicBadges').addEventListener('click', function() {
      const container = document.getElementById('dynamicBadgeContainer');
      
      // Adicionar várias badges para testar
      const techs = ['html', 'css', 'javascript', 'php', 'jquery', 'bootstrap', 'isotope', 'sql'];
      
      container.innerHTML = ''; // Limpar conteúdo anterior
      
      techs.forEach(tech => {
        const badge = document.createElement('span');
        badge.className = `id-tech-${tech}`;
        badge.textContent = tech.charAt(0).toUpperCase() + tech.slice(1);
        badge.style.marginRight = '10px';
        container.appendChild(badge);
      });
      
      // Disparar evento para recarregar ícones
      document.dispatchEvent(new CustomEvent('reload-tech-badges'));
    });
  </script>
</body>
</html>
