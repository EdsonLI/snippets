<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Ícone Bootstrap</title>
  
  <!-- Biblioteca Iconify -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  
  <!-- Estilos do Projeto -->
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/tech-badges-new.css">
  <link rel="stylesheet" href="../assets/css/tech-icons-common.css">
  <link rel="stylesheet" href="../assets/css/jquery-icon-simple.css">
  <link rel="stylesheet" href="../assets/css/bootstrap-icon-custom.css">
  <link rel="stylesheet" href="../assets/css/w3schools-icon-custom.css">
  <link rel="stylesheet" href="../assets/css/isotope-icon-custom.css">
  
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
    }
    
    .test-section {
      margin-bottom: 30px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    
    h2 {
      margin-top: 0;
    }
    
    .example-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0;
      align-items: center;
    }
    
    .badge-example {
      padding: 10px;
      border: 1px dashed #ccc;
      border-radius: 4px;
    }
    
    pre {
      background-color: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }
    
    .result-section {
      background-color: #f8f9fa;
      padding: 15px;
      margin-top: 20px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Teste de Ícone do Bootstrap</h1>
  
  <div class="test-section">
    <h2>Badge Bootstrap (SVG Personalizado)</h2>
    
    <div class="example-row">
      <div class="badge-example">
        <span class="id-tech-bootstrap">Bootstrap</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-bootstrap">Bootstrap v5.3</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-bootstrap">Bootstrap Framework</span>
      </div>
    </div>
    
    <pre><code>// HTML:
&lt;span class="id-tech-bootstrap"&gt;Bootstrap&lt;/span&gt;</code></pre>
  </div>
  
  <div class="test-section">
    <h2>Comparação com Outras Tecnologias</h2>
    
    <div class="example-row">
      <div class="badge-example">
        <span class="id-tech-javascript">JavaScript</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-jquery">jQuery</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-bootstrap">Bootstrap</span>
      </div>
      
      <div class="badge-example">
        <span class="id-tech-php">PHP</span>
      </div>
    </div>
  </div>
  
  <div class="test-section">
    <h2>Teste de Carregamento Dinâmico</h2>
    <button id="addDynamicBadge">Adicionar Badge Bootstrap Dinamicamente</button>
    <div id="dynamicBadgeContainer" class="result-section">
      <!-- Badges dinâmicos serão adicionados aqui -->
    </div>
  </div>
  
  <!-- Carregar Scripts do Projeto -->
  <script src="../assets/js/tech-badges-new.js"></script>
  
  <script>
    // Script para teste de carregamento dinâmico
    document.getElementById('addDynamicBadge').addEventListener('click', function() {
      const container = document.getElementById('dynamicBadgeContainer');
      const badge = document.createElement('span');
      badge.className = 'id-tech-bootstrap';
      badge.textContent = 'Bootstrap Dinâmico';
      badge.style.marginRight = '10px';
      container.appendChild(badge);
      
      // Disparar evento para recarregar ícones
      document.dispatchEvent(new CustomEvent('reload-tech-badges'));
    });
  </script>
</body>
</html>
