   $charset = 'utf8mb4';

   $dsn = "mysql:host=$host;dbname=$db;charset=$charset";
   $options = [
      PDO::ATTR_ERRMODE            =&gt; PDO::ERRMODE_EXCEPTION,
      PDO::ATTR_DEFAULT_FETCH_MODE =&gt; PDO::FETCH_OBJ,
      PDO::ATTR_EMULATE_PREPARES   =&gt; false,
   ];

   return new PDO($dsn, $user, $pass, $options);

try {
   $pdo = getConnection();

   // Filtro dinâmico
   $filtro = 'ana';

   $stmt-&gt;bindValue(':nome', '%' . $filtro . '%', PDO::PARAM_STR);

  <!-- Copy to clipboard logic -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.copy-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const targetId = btn.getAttribute('data-target'); // Obtém o ID do bloco de código
          const codeBlock = document.getElementById(targetId); // Localiza o bloco de código correspondente
          if (codeBlock) {
            const text = codeBlock.textContent.trim(); // Obtém o texto do bloco de código
            navigator.clipboard.writeText(text).then(function () {
              btn.classList.add('copied');
              btn.innerHTML = '<i class="fa-solid fa-check"></i> Copiado!'; // Feedback visual
              setTimeout(function () {
                btn.classList.remove('copied');
                btn.innerHTML = '<iconify-icon icon="mdi:content-copy"></iconify-icon>'; // Restaura o ícone original
              }, 1200);
            });
          }
        });
      });
    });
    // Theme toggle logic
    document.addEventListener('DOMContentLoaded', function () {
      const themeBtn = document.getElementById('theme-toggle');
      const icon = themeBtn.querySelector('iconify-icon'); // Corrigido para selecionar o elemento correto
      function setTheme(dark) {
        document.body.classList.toggle('dark-theme', dark);
        //icon.setAttribute('icon', dark ? 'fa6-solid:sun' : 'fa6-regular:moon'); // Atualiza o ícone corretamente
        themeBtn.title = dark ? 'Tema claro' : 'Tema escuro';
        localStorage.setItem('theme', dark ? 'dark' : 'light');
      }
      const saved = localStorage.getItem('theme');
      setTheme(saved === 'dark');
      themeBtn.addEventListener('click', function () {
        setTheme(!document.body.classList.contains('dark-theme'));
      });
    });
